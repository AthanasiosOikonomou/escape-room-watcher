<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Escape room watchlist</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>Rooms I want to play</h1>
    </header>

    <main>
      <form id="add" class="add" novalidate>
        <label for="add-url">Add a room</label>
        <div class="add-row">
          <input
            id="add-url"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Paste a room link from escapeall.gr"
            aria-describedby="add-hint"
          />
          <button type="submit" class="primary">Add room</button>
        </div>
        <p id="add-hint" class="hint" role="status"></p>
      </form>

      <div id="notice" class="notice" role="alert" hidden></div>

      <section aria-labelledby="count">
        <div class="list-head">
          <h2 id="count">Loading the watchlist</h2>
          <div id="find" class="find" role="search" hidden>
            <label for="find-input" class="sr-only">Find a room on the list</label>
            <input
              id="find-input"
              type="search"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Find by name or link"
            />
          </div>
        </div>
        <ol id="rooms" class="rooms"></ol>
        <p id="empty" class="empty" hidden></p>
      </section>
    </main>

    <dialog id="slots" class="sheet" aria-labelledby="slots-title">
      <form id="slots-form" novalidate>
        <h2 id="slots-title">When could you play?</h2>
        <label class="field">
          <span class="field-name">Room name</span>
          <input id="slots-name" type="text" maxlength="80" autocomplete="off" />
        </label>
        <div id="slots-list" class="slots-list"></div>
        <button type="button" id="slots-add" data-key="slots-add">Add another slot</button>
        <div class="sheet-foot">
          <button type="button" id="slots-cancel">Cancel</button>
          <button type="submit" id="slots-done" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <div id="savebar" class="savebar" hidden>
      <p id="save-text"></p>
      <div class="savebar-actions">
        <button type="button" id="discard">Discard changes</button>
        <button type="button" id="save" class="primary">Save changes</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
